<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Specify Publisher SDK — vanilla JS example</title>
  </head>
  <body class="bg-white text-slate-900">
    <main class="mx-auto flex max-w-md flex-col gap-6 p-8">
      <h1 class="text-lg font-semibold">Specify browser SDK</h1>

      <div class="flex flex-wrap items-center gap-2">
        <button
          id="connect"
          type="button"
          class="rounded bg-slate-900 px-3 py-2 text-sm font-medium text-white disabled:opacity-50"

          Connect wallet
        </button>
        <button id="preferences" type="button" class="text-sm underline">
          Consent
        </button>
      </div>

      <p id="account" class="font-mono text-xs text-slate-500"></p>
      <p id="status" class="text-sm text-slate-500"></p>
      <div id="slot"></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
